<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delmar Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <!-- Header fixo com logo centralizada e botão -->
    <div class="header-logo">
        <!-- Botão para abrir/fechar menu -->
        <button class="btn btn-primary menu-button" id="toggleMenu">☰</button>

        <!-- Logo centralizada -->
        <a class="navbar-brand" href="#">
            <img src="assets/img/logo.png" alt="Logo" width="180" height="40" class="d-inline-block align-text-top">
        </a>
    </div>

    <!-- Menu lateral -->
    <div class="sidebar" id="sidebarMenu">
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
            <li class="nav-item">
                <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
                    href="#submenu1" role="button" aria-expanded="false" aria-controls="submenu1">
                    Segmentos
                    <i class="bi bi-chevron-down"></i>
                </a>
                <div class="collapse" id="submenu1">
                    <ul class="nav flex-column ms-3">
                        <li class="nav-item"><a class="nav-link" href="#">Delmar Analytics</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Delmar Controls</a></li>
                    </ul>
                </div>
            </li>
            <li class="nav-item">
                <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
                    href="#submenu2" role="button" aria-expanded="false" aria-controls="submenu2">
                    Produtos
                    <i class="bi bi-chevron-down"></i>
                </a>
                <div class="collapse" id="submenu2">
                    <ul class="nav flex-column ms-3">
                        <li class="nav-item"><a class="nav-link" href="#">Opção 1</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Opção 2</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Opção 3</a></li>
                    </ul>
                </div>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">Serviços</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Sobre</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contato</a></li>
        </ul>
    </div>

    <!-- Conteúdo principal -->
    <div class="content container mt-4" id="mainContent">
        <h1>Bem-vindo!</h1>
        <p>Este é o conteúdo da página. Quando o menu abre, ele empurra o conteúdo para o lado.</p>
        <p style="height:1000px;">(Conteúdo longo para testar a rolagem)</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/script.js"></script>
    </script>
</body>

</html>
